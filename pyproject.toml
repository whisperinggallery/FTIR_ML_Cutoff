[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftir-cutoff"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ftir-cutoff = "ftir_cutoff.cli:main"

[tool.setuptools.packages.find]
include = ["ftir_cutoff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
