name: FTIR analysis and tests
on:
  push:
    paths: ['data/**', 'ftir_cutoff/**', 'tests/**', '.github/scripts/**', 'pyproject.toml', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        id: install
        run: python -m pip install -e '.[test,ml]'
      - name: Test
        run: python -m pytest -q
      - name: Analyze uploaded data
        if: ${{ !cancelled() && steps.install.outcome != 'failure' }}
        run: python -m ftir_cutoff
      - name: Evaluate raw-only features and baselines (preliminary)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ftir_cutoff.ml evaluate --baselines-only --output-dir results/ml_baselines
      - name: Compare Random Forest with baselines (preliminary)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ftir_cutoff.ml evaluate --output-dir results/ml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ftir-results
          path: results/
          if-no-files-found: warn

  test-auto-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test PR automation with a mocked GitHub API
        run: node --test tests/test_auto_pr.cjs
